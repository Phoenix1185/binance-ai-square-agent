# FREE Render Web Service.
# GitHub Actions is only the scheduler/trigger; Binance is contacted by Render.
services:
  - type: web
    name: binance-ai-square-agent
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: AGENT_TRIGGER_TOKEN
        sync: false
      - key: GITHUB_AGENT_TOKEN
        sync: false
      - key: GITHUB_AGENT_REPO
        value: Phoenix1185/binance-ai-square-agent
      - key: BINANCE_SQUARE_OPENAPI_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: SELF_HOSTED_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SELF_HOSTED_API_URL
        value: https://concerned-swordfish-suhailtechlnfo-01fd2de0.koyeb.app
      - key: SELF_HOSTED_MODEL
        value: deepseek-v4-flash
      - key: POST_MIN_WORDS
        value: "90"
      - key: POST_MAX_WORDS
        value: "230"
